# Netlify configuration.
#
# Deliberately no [build] section: the build command and publish directory are set on the site itself, and adding
# them here would silently override that. This file only sets cache headers.
#
# Why they matter: the build is about 118 MB and roughly 117 MB of it is game-assets (models, audio, panoramas).
# Netlify's default for files it cannot prove are immutable is to revalidate on every request, which means a
# returning player makes a hundred-odd conditional round trips before the first frame. The two groups below are
# cached differently because only one of them has content-hashed file names.

# Vite's own bundles and fonts: the file name contains a content hash, so a changed file is a new URL and the old
# one can be kept forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Game art and audio: these keep stable names (cycle-argon.glb and so on), so they cannot be marked immutable.
# A day of freshness, then served instantly from cache while it revalidates in the background. The trade is that
# a player who visits within a day of an asset being replaced may see the previous version; for art and audio
# that is a fair price for not re-downloading a hundred megabytes.
[[headers]]
  for = "/game-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

# The entry point must never be cached, or a deploy does not reach anyone: it is what points at the hashed bundles.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
